name: CI/CD

on:
  push:
    branches: [ "master", "test-API" ]
  pull_request:
    branches: [ "master", "test-API" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Start API Server
        run: |
          java -jar target/sdetAPI-1.0-SNAPSHOT.jar
          sleep 30

      - name: Run API tests
        run: mvn test -Dselenium.browser=headless-chrome

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin